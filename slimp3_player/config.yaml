name: "SLIMP3 Player"
version: "0.1.0"
slug: "slimp3_player"
description: "Play music from Plex/DLNA servers on a SLIMP3 network music player"
url: "https://github.com/DaveMath/SLIMP3-for-HA"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:music-box"
panel_title: "SLIMP3"
map:
  - type: homeassistant_config
    read_only: false
options:
  dlna_servers: []
  player_ips: []
  sonos_ips: []
  sonos_display: true
  default_volume: 40
  spectrum: true
  display_fps: 8
  sync_ms: 0
schema:
  dlna_servers:
    - url
  player_ips:
    - str
  sonos_ips:
    - str
  sonos_display: bool
  default_volume: "int(0,100)"
  spectrum: bool
  display_fps: "int(1,15)"
  sync_ms: "int(-2000,2000)"
