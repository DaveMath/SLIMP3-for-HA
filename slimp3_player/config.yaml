name: "SLIMP3 Player"
version: "0.12.0"
slug: "slimp3_player"
description: "Play music from Plex/DLNA servers on a SLIMP3 network music player, or show what Sonos is playing on your network."
url: "https://github.com/DaveMath/SLIMP3-for-HA"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:music-box"
panel_title: "SLIMP3"
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant_config
options:
  dlna_servers: []
  player_ips: []
  sonos_ips: []
  sonos_discovery: true
  apple_discovery: true
  cast_discovery: true
  cast_ips: []
  players: []
  sonos_display: true
  boot_screens: true
  sleep_mode: false
  sleep_keywords:
    - white noise
    - brown noise
    - pink noise
    - balanced noise
    - bright noise
    - dark noise
    - rain
    - rainfall
    - ocean
    - thunder
    - thunderstorm
    - ambient sounds
    - sleep sounds
    - nature sounds
    - lullaby
    - sleep
  default_volume: 40
  mp3_passthrough: true
  spectrum: true
  display_fps: 8
  sync_ms: 2
schema:
  dlna_servers:
    - url
  player_ips:
    - str
  sonos_ips:
    - str
  sonos_discovery: bool
  apple_discovery: bool
  cast_discovery: bool
  cast_ips:
    - str
  players:
    - mac: str
      name: "str?"
      sleep_mode: "bool?"
      sonos_room: "str?"
      apple_room: "str?"
      cast_room: "str?"
      show_sonos: "bool?"
      volume: "int(0,100)?"
      spectrum: "bool?"
      sync_ms: "int(-2000,2000)?"
  sonos_display: bool
  boot_screens: bool
  sleep_mode: bool
  sleep_keywords:
    - str
  default_volume: "int(0,100)"
  mp3_passthrough: bool
  spectrum: bool
  display_fps: "int(1,15)"
  sync_ms: "int(-2000,2000)"
