configuration:
  dlna_servers:
    name: Media servers (optional)
    description: >-
      Optional. DLNA servers on your network are found automatically and listed on the Info page of this app, where you
      can add one with a click. Only list description URLs here if you want them written in the configuration, for example
      http://192.168.1.10:32469/DeviceDescription.xml for the Plex DLNA server.
  player_ips:
    name: SLIMP3 addresses (optional)
    description: >-
      Only needed if a player does not find the server by itself. Leave empty
      for normal broadcast discovery.
  sonos_ips:
    name: Sonos player addresses (optional)
    description: >-
      Sonos players are found automatically. Only add an address here if discovery cannot see them
      (for example when they are on another network segment). An address keeps Sonos polling on even if the
      automatic search is off. Read-only: the app never controls Sonos.
  sonos_discovery:
    name: Find Sonos players automatically
    description: >-
      Search the network for Sonos players. Turning this off stops only the search: players listed under sonos_ips are
      still polled. To switch Sonos off completely, turn this off and leave sonos_ips empty.
  sonos_display:
    name: Show Sonos on the display
    description: >-
      When the SLIMP3 is idle and a Sonos group is playing, show the station on the top
      line (for example "CH 55 - SiriusXM Chill") and artist and title scrolling on the bottom line.
  players:
    name: Per-player settings
    description: >-
      One entry per SLIMP3, matched by MAC address (shown on the Info page and in the app log).
      name is a label. sonos_room, apple_room and cast_room choose the Sonos room, HomePod or Google Cast device this
      player shows when idle (the Info page lists the exact names); leave them all empty to show whatever is playing.
      show_sonos turns that display off for this player, sleep_mode overrides the sleep mode setting below for this
      player, and volume, spectrum and sync_ms override the defaults below.
  apple_discovery:
    name: Find HomePods automatically
    description: >-
      Show what a HomePod is playing on a SLIMP3 display, like Sonos. HomePods are found on the network and need no
      pairing; the app only reads what they are playing. Needs the HomePod access setting to allow your network
      (the default).
  cast_discovery:
    name: Find Google Home and Cast devices automatically
    description: >-
      Show what a Google Home, Nest or other Cast device is playing on a SLIMP3 display, like Sonos. Devices are found
      on the network; no Google account or login is used, and the app only reads what they are playing. Turning
      this off switches Cast off completely, including any cast_ips.
  cast_ips:
    name: Google Cast device addresses (optional)
    description: >-
      Only add an address here if automatic discovery cannot see a device (for example when it is on another network
      segment).
  paused_screen_seconds:
    name: Paused speaker display (seconds)
    description: >-
      When a Sonos, HomePod or Cast speaker shown on the display is paused, show "Paused" and the room name (with the
      track below) for this many seconds, then turn the display black. 0 turns it black right away.
  sleep_mode:
    name: Sleep mode (optional)
    description: >-
      For sleep sounds (white noise, rain, ocean and similar): the display shows them for 10 seconds, counts down
      10 seconds with "Going to sleep", then stays dark while they play. Works for music and for Sonos, HomePod or
      Cast speakers shown on the display. Keywords are below. A players entry can set sleep_mode per player.
  sleep_keywords:
    name: Sleep sound keywords (optional)
    description: >-
      Words that mark sleep sounds, matched as whole words in the title, artist or album, ignoring case. Note that
      a song such as "Purple Rain" also matches "rain".
  boot_screens:
    name: Show setup screens on the SLIMP3
    description: >-
      When a SLIMP3 connects or restarts, show its IP address and MAC address and step-by-step setup
      prompts on its display.
  default_volume:
    name: Default volume
    description: Volume (0-100) used when a player first connects.
  mp3_passthrough:
    name: Send MP3 files untouched
    description: >-
      The SLIMP3 decodes MP3 itself, so MP3 files are sent as they are (no transcoding). Turn off to
      convert everything to 128 kbps MP3 with ffmpeg instead, for example if a particular file will not play.
  spectrum:
    name: Waveform display (spectrum analyzer)
    description: >-
      Show a moving spectrum analyzer on the bottom display line while music plays from a media server. On by default.
      The app times it at start-up and falls back to the artist and title layout if the machine is too slow. Turn off
      to show the artist on the top line and the title on the bottom line instead.
  display_fps:
    name: Display frame rate
    description: Display updates per second while the analyzer is running.
  sync_ms:
    name: Waveform delay (ms)
    description: >-
      Shift the waveform display earlier (negative) or later (positive) to match the sound. Default 2.
