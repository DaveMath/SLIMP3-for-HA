configuration:
  dlna_servers:
    name: DLNA / UPnP media servers
    description: >-
      Description URLs of your media servers, for example
      http://192.168.1.10:32469/DeviceDescription.xml for the Plex DLNA server.
  player_ips:
    name: SLIMP3 addresses (optional)
    description: >-
      Only needed if a player does not find the server by itself. Leave empty
      for normal broadcast discovery.
  sonos_ips:
    name: Sonos player addresses
    description: >-
      IP address of any one Sonos player (add a second as a backup). The app reads the whole
      household from it, finds each group's coordinator and reads what it is playing. Read-only.
  sonos_display:
    name: Show Sonos on the display
    description: >-
      When the SLIMP3 is idle and a Sonos group is playing, show the station on the top
      line (for example "CH 55 - SiriusXM Chill") and artist and title scrolling on the bottom line.
  players:
    name: Per-player settings
    description: >-
      One entry per SLIMP3, matched by MAC address (shown in the app log and in the sidebar page).
      name is a label, sonos_room is the Sonos room this player mirrors, show_sonos turns the Sonos
      display off for this player, and volume, spectrum and sync_ms override the defaults below.
  default_volume:
    name: Default volume
    description: Volume (0-100) used when a player first connects.
  spectrum:
    name: Spectrum analyzer
    description: >-
      Show a spectrum analyzer on the bottom display line. When off, the display
      shows the artist on the top line and the track title on the bottom line.
  display_fps:
    name: Display frame rate
    description: Display updates per second while the analyzer is running.
  sync_ms:
    name: Analyzer sync offset (ms)
    description: Shift the analyzer earlier (negative) or later (positive) to match the sound.
