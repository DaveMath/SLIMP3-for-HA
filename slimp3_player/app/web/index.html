<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLIMP3</title>
<style>
:root{color-scheme:dark;--bg:#111;--card:#1c1c1c;--fg:#eee;--dim:#999;--acc:#3b82f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--card);padding:12px 16px;border-bottom:1px solid #333;z-index:2}
#np{font-size:15px;min-height:2.6em}#np small{color:var(--dim);display:block}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{background:#2a2a2a;color:var(--fg);border:0;border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
button.p{background:var(--acc)}button:disabled{opacity:.4}
input[type=range]{flex:1;min-width:120px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
#crumbs{color:var(--dim);font-size:13px;margin-bottom:8px}#crumbs a{color:var(--acc);cursor:pointer}
.item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #262626;cursor:pointer}
.item:hover{background:#181818}.item .t{flex:1;min-width:0}.item .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{color:var(--dim);font-size:12px}.ic{width:22px;text-align:center;color:var(--dim)}
select{background:#2a2a2a;color:var(--fg);border:0;border-radius:8px;padding:8px}
#msg{color:#f87171;font-size:13px;margin:6px 0;min-height:1em}
</style></head><body>
<header>
  <div id="np">Nothing playing</div>
  <div class="row">
    <button onclick="ctl('prev')">&#9198;</button>
    <button class="p" onclick="ctl('toggle')" id="pp">&#9654;&#65039;</button>
    <button onclick="ctl('next')">&#9197;</button>
    <button onclick="ctl('stop')">&#9209;</button>
    <input type="range" id="vol" min="0" max="100" value="40" oninput="vol(this.value)">
    <span id="volv">40</span>
  </div>
</header>
<main>
  <div class="row"><select id="player" onchange="poll()"></select><select id="src" onchange="root()"></select><span id="dev" style="color:var(--dim);font-size:13px"></span></div>
  <div id="crumbs"></div><div id="msg"></div><div id="list"></div>
</main>
<script>
let stack=[], volTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text()||r.status);return r.json();}
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const mac=()=>$('player').value||undefined;
async function poll(){try{const s=await api('api/state');
  const sel=$('player'),want=s.players.map(x=>x.mac).join();
  if(sel.dataset.macs!==want){const keep=sel.value;sel.dataset.macs=want;sel.innerHTML=s.players.map(x=>'<option value="'+x.mac+'">'+esc(x.name||x.mac)+'</option>').join('');if(keep)sel.value=keep;}
  const p=s.players.find(x=>x.mac===sel.value)||s.players[0];
  $('dev').textContent=p?(p.mac+' ('+p.ip+')'):'No SLIMP3 connected';
  if(p&&p.meta&&p.meta.title){$('np').innerHTML=esc(p.meta.title)+'<small>'+esc(p.meta.artist||'')+(p.meta.album?' - '+esc(p.meta.album):'')+' &middot; '+p.state+' '+fmt(p.position)+'</small>';}
  else $('np').textContent='Nothing playing';
  $('pp').innerHTML=(p&&p.state==='paused')?'&#9654;&#65039;':'&#9208;&#65039;';
  if(p&&document.activeElement!==$('vol')){$('vol').value=p.volume;$('volv').textContent=p.volume;}
  if(!$('src').options.length&&s.sources.length){$('src').innerHTML=s.sources.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');root();}
 }catch(e){}}
function ctl(a){post('api/control',{mac:mac(),action:a}).then(poll).catch(e=>$('msg').textContent=e.message);}
function vol(v){$('volv').textContent=v;clearTimeout(volTimer);volTimer=setTimeout(()=>post('api/control',{mac:mac(),action:'volume',value:+v}),150);}
function root(){stack=[{id:'0',title:$('src').selectedOptions[0]?.text||'Library'}];load();}
async function load(){const cur=stack[stack.length-1];$('msg').textContent='';
  $('crumbs').innerHTML=stack.map((c,i)=>'<a onclick="up('+i+')">'+esc(c.title)+'</a>').join(' / ');
  try{const r=await api('api/browse?source='+$('src').value+'&id='+encodeURIComponent(cur.id));
    const hasTracks=r.items.some(i=>!i.container);
    let h=(stack.length>1&&hasTracks)?'<div class="item" onclick="playAll()"><span class="ic">&#9654;</span><div class="t"><b>Play all</b></div></div>':'';
    h+=r.items.map((i,n)=>'<div class="item" onclick="open_('+n+')"><span class="ic">'+(i.container?'&#128193;':'&#9835;')+'</span><div class="t"><div>'+esc(i.title)+'</div><div class="s">'+esc(i.artist||'')+(i.duration?' &middot; '+i.duration.replace(/^0:/,'').replace(/\.\d+$/,''):'')+'</div></div></div>').join('');
    $('list').innerHTML=h||'<div class="s">Empty</div>';window.items=r.items;
  }catch(e){$('msg').textContent=e.message;$('list').innerHTML='';}}
function up(i){stack=stack.slice(0,i+1);load();}
function open_(n){const it=window.items[n];if(it.container){stack.push({id:it.id,title:it.title});load();}
  else{play({container:stack[stack.length-1].id,start_id:it.id});}}
function playAll(){play({container:stack[stack.length-1].id});}
function play(b){b.source=$('src').value;b.mac=mac();post('api/play',b).then(poll).catch(e=>$('msg').textContent=e.message);}
setInterval(poll,1000);poll();
</script></body></html>
